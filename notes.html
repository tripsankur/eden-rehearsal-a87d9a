  $("eb-left").textContent = `Slide ${s.n} of ${DATA.length} · ${s.kicker}`;
  $("title").textContent = s.title;
  $("meta").innerHTML = `<span class="chip"><strong>${s.budget||"—"}</strong> min</span><span class="chip"><strong>${s.clicks}</strong> ${s.clicks===1?"click":"clicks"}</span>`;
  $("notes").innerHTML = s.paras.map(p => "<p>" + p.map(r => {
    if (r.cue) return `<span class="cue cue-${r.cue}">${esc(r.t)}</span>`;
    return r.b ? `<strong>${esc(r.t)}</strong>` : `<span class="plain">${esc(r.t)}</span>`;
  }).join("") + "</p>").join("");
  $("prev").disabled = cur===0; $("next").disabled = cur===DATA.length-1;
  $("dots").innerHTML = DATA.map((_,i)=>`<b class="${i===cur?"on":""}"></b>`).join("");
  document.documentElement.style.setProperty("--fs", SIZES[size]);
  $("drill").setAttribute("aria-pressed", document.body.classList.contains("drill") ? "true" : "false");
  window.scrollTo({top:0});
  try { localStorage.setItem("eden-slide", String(cur)); localStorage.setItem("eden-size", String(size)); } catch(e){}
}
function go(i){ if(i<0||i>=DATA.length) return; cur=i; render(); }
$("prev").onclick = ()=>go(cur-1); $("next").onclick = ()=>go(cur+1);
$("drill").onclick = ()=>{ document.body.classList.toggle("drill"); try{localStorage.setItem("eden-drill", document.body.classList.contains("drill")?"1":"0");}catch(e){} render(); };
$("size").onclick = ()=>{ size=(size+1)%SIZES.length; render(); };
const panel = $("panel");
DATA.forEach((s,i)=>{ const b=document.createElement("button"); b.className="item"; b.innerHTML=`<span class="n">${String(s.n).padStart(2,"0")}</span><span class="t">${esc(s.title)}<span class="k">${esc(s.kicker)}</span></span><span class="b">${s.budget||"—"} · ${s.clicks}c</span>`; b.onclick=()=>{ go(i); $("sheet").classList.remove("open"); }; panel.appendChild(b); });
$("index").onclick = ()=>{ [...panel.querySelectorAll(".item")].forEach((el,i)=>el.classList.toggle("on",i===cur)); $("sheet").classList.add("open"); };
$("sheet").addEventListener("click", e=>{ if(e.target===$("sheet")) $("sheet").classList.remove("open"); });
document.addEventListener("keydown", e=>{ if(e.key==="ArrowRight") go(cur+1); if(e.key==="ArrowLeft") go(cur-1); if(e.key==="Escape") $("sheet").classList.remove("open"); });
let tx=null; document.addEventListener("touchstart", e=>{ tx=e.touches[0].clientX; }, {passive:true});
document.addEventListener("touchend", e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70){ dx<0?go(cur+1):go(cur-1); } }, {passive:true});
render();
</script>
